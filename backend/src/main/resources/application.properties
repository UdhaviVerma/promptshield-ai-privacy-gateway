spring.application.name=promptshield-backend
server.port=${SERVER_PORT:${PORT:8080}}

spring.datasource.url=${SPRING_DATASOURCE_URL:${DATABASE_URL:jdbc:postgresql://localhost:5432/promptshield}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${DATABASE_USER:postgres}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${DATABASE_PASSWORD:postgres}}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}
app.audit.retention-days=${AUDIT_RETENTION_DAYS:30}
app.provider.enabled=${PROVIDER_ENABLED:false}
app.provider.base-url=${PROVIDER_BASE_URL:https://api.openai.com/v1}
app.provider.model=${PROVIDER_MODEL:gpt-4o-mini}
app.provider.api-key=${PROVIDER_API_KEY:}

# Keep request payloads bounded for demo safety.
app.inspect.max-prompt-length=${INSPECT_MAX_PROMPT_LENGTH:6000}
