services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: promptshield
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - promptshield_pg:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
    environment:
      PORT: 8080
      DATABASE_URL: jdbc:postgresql://postgres:5432/promptshield
      DATABASE_USER: postgres
      DATABASE_PASSWORD: postgres
      CORS_ALLOWED_ORIGINS: http://localhost:5173
      PROVIDER_ENABLED: "false"
    ports:
      - "8080:8080"
    depends_on:
      - postgres

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: http://localhost:8080
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  promptshield_pg:
