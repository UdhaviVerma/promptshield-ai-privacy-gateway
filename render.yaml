services:
  - type: web
    name: promptshield-backend
    runtime: docker
    rootDir: backend
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: PORT
        value: 8080
      - key: DATABASE_URL
        fromDatabase:
          name: promptshield-db
          property: connectionString
      - key: DATABASE_USER
        fromDatabase:
          name: promptshield-db
          property: user
      - key: DATABASE_PASSWORD
        fromDatabase:
          name: promptshield-db
          property: password
      - key: CORS_ALLOWED_ORIGINS
        value: https://promptshield-frontend.onrender.com
      - key: PROVIDER_ENABLED
        value: "false"

  - type: web
    name: promptshield-frontend
    runtime: docker
    rootDir: frontend
    plan: free
    envVars:
      - key: VITE_API_BASE_URL
        value: https://promptshield-backend.onrender.com

databases:
  - name: promptshield-db
    plan: free
    databaseName: promptshield
    user: promptshield
