services:
  - type: web
    name: promptshield-backend
    runtime: docker
    rootDir: backend
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: PORT
        value: 8080
      - key: DATABASE_URL
        fromDatabase:
          name: wayfarer-db
          property: connectionString
      - key: DATABASE_USER
        fromDatabase:
          name: wayfarer-db
          property: user
      - key: DATABASE_PASSWORD
        fromDatabase:
          name: wayfarer-db
          property: password
      - key: CORS_ALLOWED_ORIGINS
        value: https://promptshield-frontend.onrender.com,https://promptshield-frontend-5gmn.onrender.com
      - key: PROVIDER_ENABLED
        value: "false"

  - type: web
    name: promptshield-frontend
    runtime: docker
    rootDir: frontend
    plan: free
    envVars:
      - key: VITE_API_BASE_URL
        value: https://promptshield-backend-bxjc.onrender.com
